name: Build FFmpeg audio decoder
description: >
  Cross-compiles FFmpeg for the decoders Android often lacks and installs
  media3's FFmpeg extension into the local Maven repository. media3 does not
  publish this extension, so the AAR is built from source and placed in the
  repository layout by hand. Cached on the media3 version, the FFmpeg version
  and the decoder list, so the compile only runs when one of those changes.

inputs:
  media3-version:
    description: >
      media3 release tag to build the extension from. Defaults to the media3
      version in the project's version catalog, which is what the app resolves
      the extension against.
    required: false
    default: ""
  ffmpeg-version:
    description: FFmpeg release tag to compile
    required: false
    default: n6.0
  decoders:
    description: Space separated list of FFmpeg decoders to enable
    required: false
    default: ac3 eac3 dca
  min-sdk:
    description: Lowest API level the natives must run on, matching the app's minSdk
    required: false
    default: "26"

runs:
  using: composite
  steps:
    - name: Resolve the media3 version
      id: version
      run: |
        set -euo pipefail
        VERSION="${{ inputs.media3-version }}"
        if [ -z "$VERSION" ]; then
          VERSION="$(sed -n 's/^media3 *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)"
        fi
        if [ -z "$VERSION" ]; then
          echo "Could not determine the media3 version"
          exit 1
        fi
        echo "Building the FFmpeg extension for media3 $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore the built extension
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/androidx/media3/media3-decoder-ffmpeg
        key: ffmpeg-decoder-${{ steps.version.outputs.version }}-${{ inputs.ffmpeg-version }}-${{ inputs.min-sdk }}-${{ hashFiles('.github/actions/build-ffmpeg-decoder/action.yml') }}

    - name: Check out media3
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: androidx/media
        ref: ${{ steps.version.outputs.version }}
        path: media3

    - name: Cross-compile FFmpeg
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y make nasm yasm pkg-config
        MODULE_PATH="$GITHUB_WORKSPACE/media3/libraries/decoder_ffmpeg/src/main"
        git clone --depth 1 --branch "${{ inputs.ffmpeg-version }}" \
          https://git.ffmpeg.org/ffmpeg.git "$MODULE_PATH/jni/ffmpeg"
        cd "$MODULE_PATH/jni"
        ./build_ffmpeg.sh "$MODULE_PATH" "$ANDROID_NDK_HOME" linux-x86_64 \
          "${{ inputs.min-sdk }}" ${{ inputs.decoders }}
      shell: bash

    - name: Install the extension
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        cd "$GITHUB_WORKSPACE/media3"
        ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease

        AAR="$(find libraries/decoder_ffmpeg -name '*release.aar' | head -1)"
        if [ -z "$AAR" ]; then
          echo "No AAR produced by :lib-decoder-ffmpeg:assembleRelease"
          find libraries/decoder_ffmpeg -name '*.aar' || true
          exit 1
        fi
        echo "Built $AAR"

        DEST="$HOME/.m2/repository/androidx/media3/media3-decoder-ffmpeg/$VERSION"
        mkdir -p "$DEST"
        cp "$AAR" "$DEST/media3-decoder-ffmpeg-$VERSION.aar"
        cat > "$DEST/media3-decoder-ffmpeg-$VERSION.pom" <<POM
        <?xml version="1.0" encoding="UTF-8"?>
        <project xmlns="http://maven.apache.org/POM/4.0.0"
                 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                 xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
          <modelVersion>4.0.0</modelVersion>
          <groupId>androidx.media3</groupId>
          <artifactId>media3-decoder-ffmpeg</artifactId>
          <version>$VERSION</version>
          <packaging>aar</packaging>
        </project>
        POM
      shell: bash

    - name: Report native size
      run: |
        du -sh ~/.m2/repository/androidx/media3/media3-decoder-ffmpeg || true
        unzip -l ~/.m2/repository/androidx/media3/media3-decoder-ffmpeg/*/*.aar \
          | grep '\.so$' || true
      shell: bash
