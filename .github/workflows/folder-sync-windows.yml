name: Windows Folder Sync CI

on:
  push:
    branches:
      - feature/windows-folder-sync
  pull_request:
    paths:
      - "desktop/**"
      - "shared/**"
      - ".github/workflows/folder-sync-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Compile and test Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile desktop Kotlin and run unit tests
        run: ./gradlew :desktop:compileKotlin :desktop:test --stacktrace
